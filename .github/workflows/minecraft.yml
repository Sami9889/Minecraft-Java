name: Minecraft Java server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MC_VERSION: '1.21.11'
      SERVER_PORT: '25565'

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Paper, Geyser, and Floodgate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          cd server

          paper_url=$(curl --fail --silent --show-error \
            "https://fill.papermc.io/v3/projects/paper/versions/${MC_VERSION}/builds" \
            | jq -r 'map(select(.channel == "STABLE"))[0].downloads["server:default"].url')
          if [[ -z "$paper_url" || "$paper_url" == "null" ]]; then
            echo "No stable Paper build found for ${MC_VERSION}." >&2
            exit 1
          fi
          curl --fail --location --show-error \
            --output paper.jar \
            "$paper_url"

          geyser_version=$(curl --fail --silent --show-error \
            https://download.geysermc.org/v2/projects/geyser | jq -r '.versions[-1]')
          geyser_build=$(curl --fail --silent --show-error \
            "https://download.geysermc.org/v2/projects/geyser/versions/${geyser_version}/builds" \
            | jq -r '.builds[-1].build')
          curl --fail --location --show-error \
            --output plugins/Geyser-Spigot.jar \
            "https://download.geysermc.org/v2/projects/geyser/versions/${geyser_version}/builds/${geyser_build}/downloads/spigot"

          floodgate_version=$(curl --fail --silent --show-error \
            https://download.geysermc.org/v2/projects/floodgate | jq -r '.versions[-1]')
          floodgate_build=$(curl --fail --silent --show-error \
            "https://download.geysermc.org/v2/projects/floodgate/versions/${floodgate_version}/builds" \
            | jq -r '.builds[-1].build')
          curl --fail --location --show-error \
            --output plugins/floodgate-spigot.jar \
            "https://download.geysermc.org/v2/projects/floodgate/versions/${floodgate_version}/builds/${floodgate_build}/downloads/spigot"

          printf 'eula=true\n' > eula.txt
          printf 'server-port=%s\n' "$SERVER_PORT" > server.properties

      - name: Start Minecraft and Cloudflare Tunnel
        shell: bash
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]]; then
            echo 'Missing CLOUDFLARE_TUNNEL_TOKEN repository secret.' >&2
            exit 1
          fi

          cd server
          java -Xms1G -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; docker rm --force minecraft-cloudflared 2>/dev/null || true' EXIT

          geyser_config_ready=false
          for attempt in {1..90}; do
            if [[ -f plugins/Geyser-Spigot/config.yml ]]; then
              sed -i 's/^  auth-type: online$/  auth-type: floodgate/' plugins/Geyser-Spigot/config.yml
              geyser_config_ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 2
          done

          if [[ "$geyser_config_ready" != true ]]; then
            echo 'Geyser config was not generated within 180 seconds.' >&2
            cat server.log
            exit 1
          fi

          for attempt in {1..90}; do
            if grep -q 'Done (' server.log; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 2
          done

          if ! grep -q 'Done (' server.log; then
            echo 'Minecraft did not become ready within 180 seconds.' >&2
            cat server.log
            exit 1
          fi

          docker run --rm --detach --name minecraft-cloudflared \
            --network host \
            cloudflare/cloudflared:latest \
            tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN"

          wait "$server_pid"

      - name: Stop Cloudflare Tunnel
        if: always()
        run: docker rm --force minecraft-cloudflared || true